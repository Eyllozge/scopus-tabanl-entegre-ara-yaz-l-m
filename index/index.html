<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akademik Atıf Dizini | Fırat Üniversitesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Kurumsal Üst Şerit -->
  <div class="corporate-topbar"></div>

  <div class="page">
    <header class="masthead">
      <div class="masthead-brand">
        <!-- Kurumsal logo hissi veren ikon -->
        <svg class="seal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
          <path d="M8 7h6"/>
          <path d="M8 11h8"/>
        </svg>
        <div class="masthead-text">
          <h1>Akademik Atıf Dizini</h1>
          <p class="eyebrow">Fırat Üniversitesi · Scopus Tabanlı Yayın Arşivi</p>
        </div>
      </div>
    </header>

    <section class="dashboard-cards">
      <div class="stat-card">
        <label>Toplam Makale</label>
        <span id="statTotalArticles">–</span>
      </div>
      <div class="stat-card">
        <label>Toplam Atıf</label>
        <span id="statTotalCitations">–</span>
      </div>
      <div class="stat-card">
        <label>Son 30 Gün</label>
        <span id="statRecent">–</span>
      </div>
    </section>

    <!-- Makale Detay Modalı -->
    <div id="articleModal" class="modal">
      <div class="modal-box">
        <button id="modalClose" class="modal-close" aria-label="Kapat">&times;</button>
        <div class="modal-title-row">
          <h2 class="modal-title"></h2>
          <a class="modal-scopus-link" href="#" target="_blank" rel="noopener noreferrer" title="Kaynağa git (DOI)" aria-label="Kaynağa git (DOI)" style="display:none;">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 17L17 7"/>
              <path d="M8 7h9v9"/>
            </svg>
          </a>
        </div>
        <p class="modal-journal"></p>
        <p class="modal-citation"></p>
        <p class="modal-authors"></p>
        <p class="modal-abstract"></p>
        <p class="modal-keywords"></p>
      </div>
    </div>

    <div class="content">
      <section class="search-panel">
        <div class="search-row">
          <select id="searchType" class="field-select" aria-label="Arama alanı">
            <option value="all">Tüm Alanlar</option>
            <option value="title">Makale Adı</option>
            <option value="author">Yazar</option>
            <option value="academic">Akademisyen / Fakülte</option>
            <option value="journal">Dergi Adı</option>
          </select>
          <input type="text" id="searchInput" class="field-input" placeholder="Aramak istediğiniz terimi girin…">
          <button id="searchBtn" class="btn-primary">Ara</button>
        </div>

        <div class="filter-row" id="articleFiltersRow">
          <label class="switch">
            <input type="checkbox" id="sortCitations">
            <span class="switch-track"><span class="switch-thumb"></span></span>
            <span class="switch-label">Atıfa göre sırala</span>
          </label>

          <label class="switch">
            <input type="checkbox" id="onlyFirat" checked>
            <span class="switch-track"><span class="switch-thumb"></span></span>
            <span class="switch-label">Sadece Fırat Üni. Yayınları</span>
          </label>

          <div class="slider-group">
            <label for="minCitations">En az atıf: <span id="minCitationsValue" class="slider-value">0</span></label>
            <input type="range" id="minCitations" min="0" max="300" value="0" step="5">
          </div>

          <div class="period-group">
            <label for="filterYear">Yıl</label>
            <select id="filterYear" class="field-select small-select">
              <option value="">Tümü</option>
            </select>

            <label for="filterMonth">Ay</label>
            <select id="filterMonth" class="field-select small-select">
              <option value="">Tümü</option>
              <option value="1">Ocak</option>
              <option value="2">Şubat</option>
              <option value="3">Mart</option>
              <option value="4">Nisan</option>
              <option value="5">Mayıs</option>
              <option value="6">Haziran</option>
              <option value="7">Temmuz</option>
              <option value="8">Ağustos</option>
              <option value="9">Eylül</option>
              <option value="10">Ekim</option>
              <option value="11">Kasım</option>
              <option value="12">Aralık</option>
            </select>
          </div>

          <button id="resetBtn" class="btn-secondary" type="button">Filtreleri Temizle</button>
        </div>
      </section>

      <!-- Arama Sonuç Alanı -->
      <section class="results">
        <div id="resultsMeta" class="results-meta" role="status"></div>
        
        <!-- Makale Listeleme Alanı -->
        <div id="resultsArea" class="results-list">
          <div class="empty-state">Aramaya başlamak için bir anahtar kelime girin.</div>
        </div>

        <!-- Akademisyen Listeleme Alanı (Arama türü 'academic' seçildiğinde açılır) -->
        <div id="academicResultsArea" class="results-list" style="display: none;"></div>

        <!-- Akademisyen Detay Paneli (Seçilen Akademisyenin Yayınları) -->
        <div id="academicDetailPanel" class="modal-box" style="display: none; margin-top: 24px; width: 100%; border: 1px solid var(--border-color, #e2e8f0); background: #fff;">
          <div class="modal-title-row">
            <h2 id="academicDetailName" class="modal-title"></h2>
          </div>
          <p><strong>Fakülte:</strong> <span id="academicDetailFaculty" class="badge" style="background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 4px; font-weight: 600;"></span></p>
          <p style="margin-bottom: 16px;"><strong>Scopus Author ID:</strong> <span id="academicDetailScopusId"></span></p>

          <h3 style="font-size: 1.1rem; font-weight: 600; margin-bottom: 12px;">Scopus İndeksli Yayınlar</h3>
          <div id="academicArticlesList" class="results-list"></div>
        </div>
      </section>
    </div>
  </div>

<script>
const API_BASE_URL = "http://127.0.0.1:8000";
const CURRENT_YEAR = new Date().getFullYear();
const MIN_YEAR = 1990;

const searchBtn = document.getElementById('searchBtn');
const searchInput = document.getElementById('searchInput');
const searchType = document.getElementById('searchType');
const sortCitations = document.getElementById('sortCitations');
const onlyFirat = document.getElementById('onlyFirat');
const minCitations = document.getElementById('minCitations');
const minCitationsValue = document.getElementById('minCitationsValue');
const filterYear = document.getElementById('filterYear');
const filterMonth = document.getElementById('filterMonth');
const resetBtn = document.getElementById('resetBtn');
const resultsArea = document.getElementById('resultsArea');
const academicResultsArea = document.getElementById('academicResultsArea');
const academicDetailPanel = document.getElementById('academicDetailPanel');
const resultsMeta = document.getElementById('resultsMeta');
const articleFiltersRow = document.getElementById('articleFiltersRow');

// Yıl dropdown'unu doldur
(function populateYears() {
  for (let y = CURRENT_YEAR; y >= MIN_YEAR; y--) {
    const opt = document.createElement('option');
    opt.value = y;
    opt.textContent = y;
    filterYear.appendChild(opt);
  }
})();

// Arama tipine göre filtre alanını gizle/göster
searchType.addEventListener('change', () => {
  if (searchType.value === 'academic') {
    articleFiltersRow.style.display = 'none';
  } else {
    articleFiltersRow.style.display = 'flex';
  }
});

minCitations.addEventListener('input', () => {
  minCitationsValue.textContent = minCitations.value + (minCitations.value === minCitations.max ? '+' : '');
});

resetBtn.addEventListener('click', () => {
  searchInput.value = '';
  searchType.value = 'all';
  articleFiltersRow.style.display = 'flex';
  sortCitations.checked = false;
  onlyFirat.checked = true;
  minCitations.value = 0;
  minCitationsValue.textContent = '0';
  filterYear.value = '';
  filterMonth.value = '';
  academicResultsArea.style.display = 'none';
  academicDetailPanel.style.display = 'none';
  resultsArea.style.display = 'block';
  showEmpty('Aramaya başlamak için bir anahtar kelime girin.');
});

function trLower(str) {
  return (str || '').toLocaleLowerCase('tr-TR');
}

function showEmpty(message, isError = false) {
  resultsMeta.textContent = '';
  resultsArea.style.display = 'block';
  academicResultsArea.style.display = 'none';
  academicDetailPanel.style.display = 'none';
  resultsArea.innerHTML = `<div class="empty-state${isError ? ' error' : ''}">${message}</div>`;
}

function formatCoverDate(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return d.getFullYear();
}

function buildScopusUrl(article) {
  if (article && article.doi) {
    return `https://doi.org/${encodeURIComponent(article.doi)}`;
  }
  return null;
}

function renderResults(articles) {
  academicResultsArea.style.display = 'none';
  academicDetailPanel.style.display = 'none';
  resultsArea.style.display = 'block';

  resultsMeta.innerHTML = `<strong>${articles.length}</strong> sonuç bulundu`;

  const citCounts = articles.map(a => Number(a.citedby_count) || 0);
  const maxCitations = citCounts.length ? Math.max(...citCounts, 1) : 1;

  resultsArea.innerHTML = articles.map(article => {
    const authorsList = article.authors
      ? article.authors.map(a => a.auth_fullname).join(', ')
      : 'Yazar bilgisi yok';
    const count = Number(article.citedby_count) || 0;
    const pct = Math.min(count / maxCitations, 1).toFixed(3);
    const year = formatCoverDate(article.cover_date);
    const metaLine = [article.publication_name || 'Dergi bilgisi yok', year].filter(Boolean).join(' · ');
    return `
      <div class="result-item">
        <div class="seal-badge" style="--pct:${pct}">
          <span class="badge-label">Atıf</span>
          <span class="badge-count">${count}</span>
        </div>
        <div class="result-body">
          <a href="#" class="article-title" data-id="${article.id}">${article.art_name}</a>
          <div class="article-authors">${authorsList}</div>
          <div class="article-meta">${metaLine}</div>
        </div>
      </div>
    `;
  }).join('');

  document.querySelectorAll('.article-title').forEach(el => {
    el.addEventListener('click', async (e) => {
      e.preventDefault();
      const id = e.target.dataset.id;
      try {
        const res = await fetch(`${API_BASE_URL}/api/articles/${id}`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        openArticleModal(data);
      } catch (err) {
        alert("Makale detayları alınamadı.");
      }
    });
  });
}

/* --- AKADEMİSYEN / FAKÜLTE ARAMA MANTIĞI --- */
async function runAcademicSearch(query) {
  resultsArea.style.display = 'none';
  academicDetailPanel.style.display = 'none';
  academicResultsArea.style.display = 'block';
  academicResultsArea.innerHTML = `<div class="empty-state">Akademisyenler taranıyor…</div>`;

  try {
    const res = await fetch(`${API_BASE_URL}/api/academics/search?q=${encodeURIComponent(query)}`);
    if (!res.ok) throw new Error();
    const data = await res.json();

    resultsMeta.innerHTML = `<strong>${data.length}</strong> akademisyen bulundu`;

    if (data.length === 0) {
      academicResultsArea.innerHTML = `<div class="empty-state">Aradığınız kriterlere uygun akademisyen bulunamadı.</div>`;
      return;
    }

    academicResultsArea.innerHTML = data.map(academic => `
      <div class="result-item" style="cursor: pointer;" onclick="loadAcademicDetail(${academic.id})">
        <div class="result-body">
          <div style="font-size: 1.1rem; font-weight: 600; color: var(--primary-color, #0f172a);">${academic.name}</div>
          <div style="color: #64748b; font-size: 0.9rem; margin-top: 4px;">Fakülte: <strong>${academic.faculty}</strong></div>
          <div style="color: #94a3b8; font-size: 0.85rem; margin-top: 2px;">${academic.email || 'E-posta tanımlanmamış'}</div>
        </div>
        <button class="btn-secondary" style="align-self: center;">Yayınları Gör &rarr;</button>
      </div>
    `).join('');

  } catch (err) {
    academicResultsArea.innerHTML = `<div class="empty-state error">Akademisyen araması yapılırken hata oluştu.</div>`;
  }
}

async function loadAcademicDetail(academicId) {
  academicDetailPanel.style.display = 'block';
  const articlesContainer = document.getElementById('academicArticlesList');
  articlesContainer.innerHTML = `<div class="empty-state">Yayınlar yükleniyor…</div>`;

  try {
    const res = await fetch(`${API_BASE_URL}/api/academics/${academicId}`);
    if (!res.ok) throw new Error();
    const data = await res.json();

    document.getElementById('academicDetailName').textContent = data.name;
    document.getElementById('academicDetailFaculty').textContent = data.faculty;
    document.getElementById('academicDetailScopusId').textContent = data.scopus_author_id || 'Yok';

    if (!data.articles || data.articles.length === 0) {
      articlesContainer.innerHTML = `<div class="empty-state">Bu akademisyen için henüz Scopus yayını eşleşmedi.</div>`;
    } else {
      articlesContainer.innerHTML = data.articles.map(art => `
        <div class="result-item">
          <div class="seal-badge">
            <span class="badge-label">Atıf</span>
            <span class="badge-count">${art.citation_count ?? 0}</span>
          </div>
          <div class="result-body">
            <div style="font-weight: 600; font-size: 1rem;">${art.title}</div>
            <div class="article-meta">${art.publication_name || 'Dergi Yok'} · ${art.cover_date || ''}</div>
            ${art.doi ? `<a href="https://doi.org/${art.doi}" target="_blank" style="font-size: 0.85rem; color: #0284c7;">DOI: ${art.doi}</a>` : ''}
          </div>
        </div>
      `).join('');
    }

    academicDetailPanel.scrollIntoView({ behavior: 'smooth' });

  } catch (err) {
    articlesContainer.innerHTML = `<div class="empty-state error">Yayın detayları alınamadı.</div>`;
  }
}

function openArticleModal(article) {
  const modal = document.getElementById('articleModal');
  modal.querySelector('.modal-title').textContent = article.art_name;
  modal.querySelector('.modal-journal').textContent = article.publication_name || '';

  const year = formatCoverDate(article.cover_date);
  const citationParts = [];
  if (year) citationParts.push(year);
  if (article.doi) citationParts.push(`DOI: ${article.doi}`);
  citationParts.push(`${article.citedby_count ?? 0} atıf`);
  modal.querySelector('.modal-citation').textContent = citationParts.join(' · ');

  modal.querySelector('.modal-authors').textContent = article.authors
    ? article.authors.map(a => a.auth_fullname).join(', ')
    : '';

  modal.querySelector('.modal-abstract').textContent =
    article.abstract || 'Bu makale için özet bilgisi mevcut değil.';

  const keywordsEl = modal.querySelector('.modal-keywords');
  if (article.keywords) {
    keywordsEl.textContent = 'Anahtar Kelimeler: ' + article.keywords;
    keywordsEl.style.display = '';
  } else {
    keywordsEl.style.display = 'none';
  }

  const scopusLink = modal.querySelector('.modal-scopus-link');
  const scopusUrl = buildScopusUrl(article);
  if (scopusUrl) {
    scopusLink.href = scopusUrl;
    scopusLink.style.display = '';
  } else {
    scopusLink.removeAttribute('href');
    scopusLink.style.display = 'none';
  }

  modal.classList.add('open');
}

function closeModal() {
  document.getElementById('articleModal').classList.remove('open');
}

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('articleModal').addEventListener('click', (e) => {
  if (e.target.id === 'articleModal') closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

async function loadDashboard() {
  try {
    const res = await fetch(`${API_BASE_URL}/api/stats/summary`);
    if (!res.ok) throw new Error("Dashboard yüklenemedi");
    const stats = await res.json();
    document.getElementById('statTotalArticles').textContent = stats.total_articles;
    document.getElementById('statTotalCitations').textContent = stats.total_citations;
    document.getElementById('statRecent').textContent = stats.recent_articles_30_days;
  } catch (error) {
    console.warn("Dashboard verileri alınırken hata oluştu:", error);
  }
}
loadDashboard();

async function runSearch() {
  const rawQuery = searchInput.value.trim();
  const query = trLower(rawQuery);

  if (!query) {
    showEmpty('Lütfen aramak için bir kelime girin.', true);
    return;
  }

  // Akademisyen araması modundaysa akademisyen arama fonksiyonunu çalıştır
  if (searchType.value === 'academic') {
    runAcademicSearch(rawQuery);
    return;
  }

  showEmpty('Makaleler taranıyor…');
  searchBtn.disabled = true;

  try {
    let url = `${API_BASE_URL}/api/articles?limit=200`;

    if (sortCitations.checked) url += `&sort_by_citations=true`;
    if (onlyFirat && onlyFirat.checked) url += `&only_firat=true`;
    if (filterYear.value) url += `&year=${filterYear.value}`;
    if (filterMonth.value) url += `&month=${filterMonth.value}`;

    const filterType = searchType.value;
    if (filterType === 'journal') {
      url += `&journal=${encodeURIComponent(rawQuery)}`;
    }

    const response = await fetch(url);
    if (!response.ok) throw new Error("Arama isteği başarısız oldu.");

    const data = await response.json();
    const minCount = Number(minCitations.value);

    const filtered = data.filter(article => {
      const titleMatch = trLower(article.art_name).includes(query);
      const journalMatch = trLower(article.publication_name).includes(query);
      const authorsList = article.authors
        ? article.authors.map(a => trLower(a.auth_fullname)).join(' ')
        : '';
      const authorMatch = authorsList.includes(query);

      let matchesQuery;
      if (filterType === 'title') matchesQuery = titleMatch;
      else if (filterType === 'author') matchesQuery = authorMatch;
      else if (filterType === 'journal') matchesQuery = journalMatch;
      else matchesQuery = titleMatch || journalMatch || authorMatch;

      return matchesQuery && (Number(article.citedby_count) || 0) >= minCount;
    });

    if (filtered.length === 0) {
      showEmpty('Belirttiğiniz filtreye ve arama terimine uygun makale bulunamadı.');
      return;
    }

    renderResults(filtered);

  } catch (error) {
    console.error(error);
    showEmpty('Sunucuya bağlanılamadı. API hizmetinin çalıştığından emin olun.', true);
  } finally {
    searchBtn.disabled = false;
  }
}

searchBtn.addEventListener('click', runSearch);
searchInput.addEventListener('keypress', event => {
  if (event.key === 'Enter') {
    event.preventDefault();
    runSearch();
  }
});
</script>
</body>
</html>
